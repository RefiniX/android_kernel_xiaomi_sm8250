name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device codename'
        required: true
        default: 'lmi'
        type: choice
        options: [lmi, alioth, apollo, cas, cmi, dagu, elish, enuma, munch, pipa, psyche, umi]

env:
  CLANG_URL: https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libssl-dev libelf-dev cpio python3 zip

      - name: Setup ZyC Clang 16
        run: |
          mkdir -p $HOME/zyc-clang
          wget -q "$CLANG_URL" -O /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C $HOME/zyc-clang
          echo "$HOME/zyc-clang/bin" >> $GITHUB_PATH
          $HOME/zyc-clang/bin/clang --version | head -1

      - name: Fix relative include paths for O=out build
        run: |
          grep -rlZ --include=Kbuild --include=Makefile -F -e '-I$(src)/' techpack drivers sound \
            | xargs -0 sed -i 's#-I\$(src)/#-I$(srctree)/$(src)/#g'

      - name: Build
        run: |
          set -o pipefail
          MK="O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make $MK vendor/kona-perf_defconfig vendor/xiaomi/sm8250-common.config vendor/xiaomi/${{ inputs.device }}.config
          make $MK -j$(nproc) 2>&1 | tee build.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log-${{ inputs.device }}-${{ github.run_number }}
          path: build.log

      - name: Package AnyKernel3
        run: |
          git clone --depth 1 -b kona https://github.com/liyafe1997/AnyKernel3 anykernel
          rm -rf anykernel/.git
          mkdir -p anykernel/kernels
          cp out/arch/arm64/boot/Image anykernel/kernels/Image
          ZIP="Kernel_${{ inputs.device }}_$(date +%Y%m%d_%H%M)_$(git rev-parse --short=8 HEAD)_AK3.zip"
          (cd anykernel && zip -r9 "../$ZIP" . -x '*.zip')
          echo "ZIP=$ZIP" >> $GITHUB_ENV
          unzip -l "$ZIP" | tail -n 3

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}
          compression-level: 0

      - name: Upload raw images
        uses: actions/upload-artifact@v5
        with:
          name: raw-${{ inputs.device }}-${{ github.run_number }}
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img
